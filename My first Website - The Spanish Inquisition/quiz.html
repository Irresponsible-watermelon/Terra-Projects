<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A website about the Spanish Inquisition, its origins, societal responses, and key figures.">
    <meta name="keywords" content="Spanish Inquisition, Inquisition, Spanish Empire, Inquisitor,">
    <script src="scripts.js" defer></script>


    <title>The Spanish Inquisition</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <link rel="stylesheet" href="supplementary.css">
    <link rel="icon" type="image/x-icon" href="https://upload.wikimedia.org/wikipedia/commons/9/90/Inquisici%C3%B3n_espa%C3%B1ola.svg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original" cite="https://commons.wikimedia.org/wiki/File:Inquisici%C3%B3n_espa%C3%B1ola.svg">

</head>

<body>
  <nav class="navbar is-fixed-top is-dark" role="navigation" aria-label="main navigation">
    <div class="navbar-brand">
      <a class="navbar-item" href="index.html" target="_self">
        <image cite="https://commons.wikimedia.org/wiki/File:Inquisici%C3%B3n_espa%C3%B1ola.svg" src="https://upload.wikimedia.org/wikipedia/commons/9/90/Inquisición_española.svg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original">Home</image>
      </a>
      <a class="navbar-item" href="External-Links.html" target="_self">External Links</a>
      <a class="navbar-item" href="quiz.html" target="_self">Quiz</a>
    
    </div>

  </nav>
  <div class="container is-max-tablet mt-3" id="Quiz">
    <form action="scripts.js">

      <div class="field box">
        <div>
        <h2 class="subtitle m-0">1) Who appointed the Grand Inquisitor?</h2>
        <hr class="mt-1 mb-2">
        </div>
        <div class="control m-1">
          <label class="radio input">
            <input type="radio" name="Q1" value="1A"/>
            The Pope
          </label>
        </div>
        <div class="control m-1">
          <label class="radio input">
            <input type="radio" name="Q1" value="1B"/>
            The Spanish Monarch
          </label>
        </div>
        <div class="control m-1">
          <label class="radio input">
            <input type="radio" name="Q1" value="1C"/>
            The Privy Council
          </label>
        </div>
        <div class="control m-1">
          <label class="radio input">
            <input type="radio" name="Q1" value="1D"/>
            The Archbishop of Barcelona
          </label>
        </div>
      </div>
      <div class="field box">
        <div>
        <h2 class="subtitle m-0">2) When was the Inquisition established?</h2>
        <hr class="mt-1 mb-2">
        </div>
        <div class="control m-1">
          <label class="radio input">
            <input type="radio" name="Q2" Value="2A"/>
            1478
          </label>
        </div>
        <div class="control m-1">
          <label class="radio input">
            <input type="radio" name="Q2" value="2B"/>
            1492
          </label>
        </div>
        <div class="control m-1">
          <label class="radio input">
            <input type="radio" name="Q2" value="2C"/>
            1518
          </label>
        </div>
        <div class="control m-1">
          <label class="radio input">
            <input type="radio" name="Q2" value="2D"/>
            1507
          </label>
        </div>
      </div>
      <div class="field box">
        <div>
        <h2 class="subtitle m-0">3) What was the primary function of the Inquisition?</h2>
        <hr class="mt-1 mb-2">
        </div>
        <div class="control m-1">
          <label class="radio input">
            <input type="radio" name="Q3" value="3A"/>
            Converting individuals to Catholicism
          </label>
        </div>
        <div class="control m-1">
          <label class="radio input">
            <input type="radio" name="Q3" value="3B"/>
            Investigating Catholic converts suspected of pracitising their former faith
          </label>
        </div>
        <div class="control m-1">
          <label class="radio input">
            <input type="radio" name="Q3" value="3C"/>
            Spreading the Gospel across the Spanish Empire
          </label>
        </div>
        <div class="control m-1">
          <label class="radio input">
            <input type="radio" name="Q3" value="3D"/>
            Monitoring Spanish state religion on behalf of the Vatican
          </label>
        </div>
      </div>
      <div class="field box">
        <div>
        <h2 class="subtitle m-0">4) How did the Inquisition primarily achieve their function?</h2>
        <hr class="mt-1 mb-2">
        </div>
        <div class="control m-1">
          <label class="radio input">
            <input type="radio" name="Q4" value="4A"/>
            By performing random checks on suspected heretics
          </label>
        </div>
        <div class="control m-1">
          <label class="radio input">
            <input type="radio" name="Q4" value="4B"/>
            By performing extensive legal investigations and trials
          </label>
        </div>
        <div class="control m-1">
          <label class="radio input">
            <input type="radio" name="Q4" value="4C"/>
            By gathering evidence as suited them, often through torture and coercion
          </label>
        </div>
        <div class="control m-1">
          <label class="radio input">
            <input type="radio" name="Q4" value="4D"/>
             By detaining individuals as ordered by the Vatican
          </label>
        </div>
      </div>
      <div class="field box">
        <div>
        <h2 class="subtitle m-0">5) How has the Inquisition been viewed over time?</h2>
        <hr class="mt-1 mb-2">
        </div>
        <div class="control m-1">
          <label class="radio input">
            <input type="radio" name="Q5" value="5A"/>
            Positively at first, but oppressive later on
          </label>
        </div>
        <div class="control m-1">
          <label class="radio input">
            <input type="radio" name="Q5" value="5B"/>
            As unserious, subject to intense mockery
          </label>
        </div>
        <div class="control m-1">
          <label class="radio input">
            <input type="radio" name="Q5" value="5C"/>
            As overly violent, brutal and oppressive
          </label>
        </div>
        <div class="control m-1">
          <label class="radio input">
            <input type="radio" name="Q5" value="5D"/>
             As an unfortunate neccessary evil
          </label>
        </div>
      </div>
      <div class="field is-grouped is-grouped-right">
        <div class="control">
          <button class="button is-link is-medium">Submit</button>
        </div>
      </div>

    </form>
  </div>



</body>
</html>
